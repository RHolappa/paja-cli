name: paja-voice
services:
  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      PAJA_ORIGIN: https://${PAJA_DOMAIN:?Set PAJA_DOMAIN}
      PAJA_PASSWORD: ${PAJA_PASSWORD:?Set PAJA_PASSWORD}
      PAJA_SPEECH_MODEL: ${PAJA_SPEECH_MODEL:-small}
      HF_HOME: /data/huggingface
    volumes:
      - paja_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    environment:
      PAJA_DOMAIN: ${PAJA_DOMAIN:?Set PAJA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  paja_data:
  caddy_data:
  caddy_config:
